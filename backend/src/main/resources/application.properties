spring.application.name=hikcentral-bridge
server.address=${BACKEND_BIND_HOST:127.0.0.1}
server.port=${BACKEND_PORT:18443}
server.ssl.enabled=true
server.ssl.key-store=${BACKEND_TLS_KEYSTORE:}
server.ssl.key-store-password=${BACKEND_TLS_PASSWORD:}
server.ssl.key-store-type=PKCS12
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=jdbc:h2:file:${HIK_DATA_DIR:./data}/hikbridge;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.main.banner-mode=off
logging.level.root=WARN